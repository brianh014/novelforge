name: Release

# A v<version> tag publishes that version: `bun run publish-release` makes and pushes the tag. Run it by hand from the
# Actions tab to build the downloads without publishing, kept as an artifact, to try a build before a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, and a tag pushed twice doesn't publish twice at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Windows, as Bun can set the Windows download's icon and hide its console only when it builds on Windows. It
    # builds the Mac and Linux downloads from there too.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile

      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          version=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but package.json says $version."
            exit 1
          fi

      - name: Build the downloads
        run: bun scripts/build-release.ts

      - name: Keep the downloads of a trial build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v5
        with:
          name: novelforge-downloads
          path: dist/release
          retention-days: 7

      # A hyphen (0.1.1-alpha.1) makes a pre-release, which the app's Update never offers. A release an earlier run began
      # gets its files replaced.
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/release/* --clobber
          else
            pre=""
            case "$version" in *-*) pre="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" dist/release/* --verify-tag --title "NovelForge $version" --generate-notes $pre
          fi

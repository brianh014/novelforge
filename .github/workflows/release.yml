name: Release

# Pushing a tag such as v0.1.0-alpha.1 builds the downloads and publishes them as a Gitea release. A tag with a
# hyphen (alpha, beta, rc) is marked as a pre-release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Gitea only: it publishes through Gitea's own API. GitHub would need its own release step after the move.
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: The tag matches package.json
        run: |
          version=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
      - name: Build the downloads
        run: bun run release
      - name: Publish the release
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) pre=true ;; *) pre=false ;; esac
          body=$(bun -e 'console.log(JSON.stringify({ tag_name: process.argv[1], name: `NovelForge ${process.argv[1]}`, prerelease: process.argv[2] === "true" }))' "$GITHUB_REF_NAME" "$pre")
          id=$(curl -sS --fail-with-body -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" -d "$body" "$API/releases" \
            | bun -e 'console.log((await Bun.stdin.json()).id)')
          for file in dist/release/*; do
            name=$(basename "$file")
            echo "Uploading $name"
            curl -sS --fail-with-body -o /dev/null -X POST -H "Authorization: token $TOKEN" -F "attachment=@$file" "$API/releases/$id/assets?name=$name"
          done

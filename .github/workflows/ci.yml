name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Lint and format
        run: bunx biome ci
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Unit tests
        run: bun test
      - name: Install Playwright's Chromium
        run: bunx playwright install --with-deps chromium
      - name: End-to-end tests
        run: bun run e2e
      - name: Keep the Playwright traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: e2e/.results
          retention-days: 7
